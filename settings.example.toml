# サーバー上に settings.toml として置く。Git には入れない。
# 相対パスは、この設定ファイルのフォルダから見た位置。

data_dir = "data"
processes_dir = "processes"
log_file = "logs/service.log"
host = "127.0.0.1"
port = 8001

model = "claude-opus-5-5"
effort = "medium"
max_tokens = 32000

# 拠点ごとに、Claude API のキーと、呼び出し側に渡すキーのハッシュを書く。
# 呼び出し側のキーは `python -m document_extraction_api new-key` で作る。
# claude_api_key は拠点ごとに必須。全拠点で同じキーを書いてもよい。
[sites.parent]
claude_api_key = "sk-ant-..."
client_key_sha256 = ["<new-key が出したハッシュ>"]

[sites.subsidiary]
claude_api_key = "sk-ant-..."
client_key_sha256 = ["<new-key が出したハッシュ>"]

# 費用の計算に使う単価（USD / 100万トークン）。載っていないモデルは費用を記録しない。
[prices."claude-opus-5-5"]
input_per_mtok = 4.0
output_per_mtok = 20.0

[prices."claude-sonnet-5-5"]
input_per_mtok = 2.0
output_per_mtok = 10.0
