[project]
name = "document-extraction-api"
version = "0.1.0"
description = "Independent internal document extraction service"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "anthropic>=0.79,<2",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1",
  "pillow>=11,<13", "pypdfium2>=4.30,<6", "filelock>=3.16,<4",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.9,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/document_extraction_api"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
target-version = "py314"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
