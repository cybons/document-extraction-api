[project]
name = "document-extraction-api"
version = "0.1.0"
description = "PDF・画像から項目を抜き出してJSONで返す社内共通API"
requires-python = "==3.14.*"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_extraction_api"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.12",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
